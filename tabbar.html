<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Multi-AI Tabs</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #111; color: #eee; }
  #bar { display: flex; align-items: stretch; gap: 6px; padding: 6px 8px; height: 52px; }
  .tab { border: 1px solid #333; background: #1e1e1e; color: #ddd; border-radius: 8px; padding: 0 8px 0 14px; cursor: pointer; font-size: 14px; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .tab:hover { background: #2a2a2a; }
  .tab.active { background: #c9a227; color: #111; border-color: #c9a227; font-weight: 600; }
  .tab .close { border: none; background: transparent; color: inherit; cursor: pointer; font-size: 16px; line-height: 1; padding: 2px 4px; border-radius: 4px; }
  .tab .close:hover { background: rgba(0,0,0,0.2); }
  .nav { margin-left: auto; display: flex; gap: 6px; }
  .nav button, #addBtn { border: 1px solid #333; background: #1e1e1e; color: #ddd; border-radius: 8px; padding: 0 12px; cursor: pointer; font-size: 14px; }
  .nav button:hover, #addBtn:hover { background: #2a2a2a; }
  #addForm { display: none; align-items: center; gap: 6px; padding: 0 8px 8px; }
  #addForm.open { display: flex; }
  #addForm input { background: #1e1e1e; border: 1px solid #333; color: #eee; border-radius: 8px; padding: 8px 10px; font-size: 14px; }
  #addForm input[name="label"] { width: 180px; }
  #addForm input[name="url"] { width: 320px; }
  #addForm button { border: 1px solid #c9a227; background: #c9a227; color: #111; border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: 14px; font-weight: 600; }
  #addForm button.cancel { border-color: #333; background: #1e1e1e; color: #ddd; font-weight: 400; }
  #addError { color: #ff8080; font-size: 13px; padding: 0 8px 6px; display: none; }
</style>
</head>
<body>
<div id="bar">
  <div id="tabs" style="display: flex; gap: 6px;"></div>
  <button id="addBtn" title="Add a tab">+ Add Tab</button>
  <div class="nav">
    <button id="watchtower" title="Show or hide the Watchtower sidebar">Watchtower</button>
    <button id="back" title="Back">&#8592;</button>
    <button id="forward" title="Forward">&#8594;</button>
    <button id="reload" title="Reload">&#8635;</button>
  </div>
</div>
<div id="addForm">
  <input name="label" placeholder="Name, e.g. Muse (Work)" maxlength="40">
  <input name="url" placeholder="Website, e.g. https://muse.ai/" maxlength="300">
  <button id="addSubmit">Add</button>
  <button id="addCancel" class="cancel">Cancel</button>
</div>
<div id="addError"></div>
<script>
  const tabsEl = document.getElementById('tabs');
  const formEl = document.getElementById('addForm');
  const errorEl = document.getElementById('addError');
  const labelInput = formEl.querySelector('input[name="label"]');
  const urlInput = formEl.querySelector('input[name="url"]');

  function render(tabs, activeId) {
    tabsEl.innerHTML = '';
    tabs.forEach(function (tab) {
      const button = document.createElement('button');
      button.className = 'tab' + (tab.id === activeId ? ' active' : '');
      const label = document.createElement('span');
      label.textContent = tab.label;
      label.addEventListener('click', function () { window.tabs.switchTo(tab.id); });
      button.appendChild(label);
      if (tab.custom) {
        const close = document.createElement('button');
        close.className = 'close';
        close.textContent = '×';
        close.title = 'Remove this tab';
        close.addEventListener('click', function (e) {
          e.stopPropagation();
          if (confirm('Remove the "' + tab.label + '" tab? Its login stays saved, so adding a tab with the same name again will restore it.')) {
            window.tabs.remove(tab.id);
          }
        });
        button.appendChild(close);
      } else {
        button.addEventListener('click', function () { window.tabs.switchTo(tab.id); });
      }
      tabsEl.appendChild(button);
    });
  }
  let currentTabs = [];
  let activeId = null;
  window.tabs.list(function (tabs) { currentTabs = tabs; render(currentTabs, activeId); });
  window.tabs.onActive(function (tabId) { activeId = tabId; render(currentTabs, activeId); });
  window.tabs.onAddError(function (message) {
    errorEl.textContent = message;
    errorEl.style.display = 'block';
  });
  document.getElementById('addBtn').addEventListener('click', function () {
    formEl.classList.toggle('open');
    errorEl.style.display = 'none';
    if (formEl.classList.contains('open')) labelInput.focus();
  });
  document.getElementById('addCancel').addEventListener('click', function () {
    formEl.classList.remove('open');
    errorEl.style.display = 'none';
  });
  document.getElementById('addSubmit').addEventListener('click', function () {
    errorEl.style.display = 'none';
    window.tabs.add(labelInput.value, urlInput.value);
    labelInput.value = '';
    urlInput.value = '';
    formEl.classList.remove('open');
  });
  urlInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('addSubmit').click();
  });
  document.getElementById('back').addEventListener('click', function () { window.tabs.back(); });
  document.getElementById('watchtower').addEventListener('click', function () { window.tabs.toggleSidebar(); });
  document.getElementById('forward').addEventListener('click', function () { window.tabs.forward(); });
  document.getElementById('reload').addEventListener('click', function () { window.tabs.reload(); });
</script>
</body>
</html>
